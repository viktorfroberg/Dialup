name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The project needs Swift 6 and the macOS 15.4 SDK or newer: use the newest stable Xcode on the image.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      # Ad-hoc signing ("-") needs no certificate, so the hosted unit tests can run as-is.
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Dialup.xcodeproj \
            -scheme Dialup \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            | grep -E "error:|warning:|Test Suite|Executed|\*\* (BUILD|TEST)"
