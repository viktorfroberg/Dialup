<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dialup</title>
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="" id="skin-css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <header id="chrome">
    <!-- Title bar: drawn by the chrome, styled by the skin. Empty areas drag the window. -->
    <div id="titlebar">
      <i class="ico app-icon"></i>
      <span id="window-title">Dialup</span>
      <div class="caption-buttons">
        <button class="cap cap-min" id="cap-min" title="Minimize"></button>
        <button class="cap cap-max" id="cap-max" title="Maximize"></button>
        <button class="cap cap-close" id="cap-close" title="Close"></button>
      </div>
    </div>
    <div class="rebar">
      <!-- Standard Buttons band -->
      <div class="band" id="band-buttons">
        <div class="gripper"></div>
        <div class="buttons">
          <span class="split">
            <button class="tb has-label" id="btn-back" title="Back" disabled><i class="ico ico-back"></i><span class="label">Back</span></button>
            <button class="tb drop" id="drop-back" title="Recent pages" disabled></button>
          </span>
          <span class="split">
            <button class="tb" id="btn-forward" title="Forward" disabled><i class="ico ico-forward"></i></button>
            <button class="tb drop" id="drop-forward" title="Recent pages" disabled></button>
          </span>
          <button class="tb" id="btn-stop" title="Stop" disabled><i class="ico ico-stop"></i></button>
          <button class="tb" id="btn-reload" title="Refresh"><i class="ico ico-reload"></i></button>
          <button class="tb" id="btn-home" title="Home"><i class="ico ico-home"></i></button>
          <span class="tb-sep"></span>
          <span class="split" id="dialup-mode">
            <button class="tb has-label toggle" id="btn-dialup-mode" title="Dial-up Mode: browse like it's 1999 (⇧⌘D)"><i class="ico ico-dialup-mode"></i><span class="label">Dial-up</span></button>
            <button class="tb drop" id="drop-dialup-mode" title="Dial-up Mode settings"></button>
          </span>
        </div>
        <div class="spacer"></div>
        <div class="throbber" id="throbber" title="Dialup"></div>
      </div>
      <!-- Address band -->
      <div class="band" id="band-address">
        <div class="gripper"></div>
        <label for="address" class="band-label">Address</label>
        <div class="address-box">
          <i class="ico ico-page"></i>
          <input id="address" type="text" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off">
        </div>
        <button class="tb go" id="btn-go" title="Go to the address in the Address bar"><i class="ico ico-go"></i><span class="label">Go</span></button>
      </div>
    </div>
  </header>

  <main id="viewport"></main>

  <footer id="statusbar">
    <div class="cell grow"><i class="ico ico-page-sm"></i><span id="status-text">Done</span></div>
    <div class="cell progress"><div id="progress-bar"></div></div>
    <div class="cell zone"><i class="ico ico-zone"></i><span>Internet</span></div>
    <div class="cell sizer"></div>
  </footer>

  <!-- Menus and dialogs render here; the host raises the chrome above the page while it's in use. -->
  <div id="overlay"></div>
</body>
</html>
