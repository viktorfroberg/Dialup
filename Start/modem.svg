<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 24" width="128" height="96" shape-rendering="crispEdges">
  <!-- an original pixel-art external modem with blinking lights -->
  <rect x="2" y="10" width="28" height="9" fill="#c9c2ad"/>
  <rect x="2" y="10" width="28" height="1" fill="#e9e3cf"/>
  <rect x="2" y="18" width="28" height="1" fill="#8a8471"/>
  <rect x="3" y="19" width="3" height="2" fill="#5e5a4c"/>
  <rect x="26" y="19" width="3" height="2" fill="#5e5a4c"/>
  <rect x="4" y="12" width="9" height="2" fill="#3a3a3a"/>
  <rect x="5" y="15" width="1" height="1" fill="#2bd12b"><animate attributeName="fill" values="#2bd12b;#0b3a0b;#2bd12b" dur="1.2s" repeatCount="indefinite"/></rect>
  <rect x="8" y="15" width="1" height="1" fill="#ff3b2e"><animate attributeName="fill" values="#4a0d0a;#ff3b2e;#4a0d0a;#ff3b2e;#4a0d0a" dur="0.7s" repeatCount="indefinite"/></rect>
  <rect x="11" y="15" width="1" height="1" fill="#ffd23a"><animate attributeName="fill" values="#ffd23a;#ffd23a;#4a3a0a;#ffd23a" dur="2.1s" repeatCount="indefinite"/></rect>
  <rect x="14" y="15" width="1" height="1" fill="#2bd12b"/>
  <rect x="17" y="15" width="1" height="1" fill="#2bd12b"><animate attributeName="fill" values="#0b3a0b;#2bd12b;#0b3a0b" dur="0.4s" repeatCount="indefinite"/></rect>
  <rect x="20" y="12" width="8" height="5" fill="#b3ab94"/>
  <rect x="21" y="13" width="6" height="1" fill="#8a8471"/>
  <rect x="21" y="15" width="6" height="1" fill="#8a8471"/>
  <!-- phone cord -->
  <path d="M30 14h1v-3h-1v-2h-1v-1h-2" fill="none" stroke="#5e5a4c" stroke-width="1"/>
</svg>
