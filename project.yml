name: Kikare
options:
  bundleIdPrefix: se.kikare
  deploymentTarget:
    macOS: "15.4"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.4"
targets:
  Kikare:
    type: application
    platform: macOS
    sources:
      - path: Host
      - path: Chrome
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.kikare.Kikare
        PRODUCT_NAME: Kikare
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_CFBundleDisplayName: Kikare
        INFOPLIST_KEY_NSHumanReadableCopyright: "Kikare — a browser from 2003, built in 2026"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
  KikareTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Kikare
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
schemes:
  Kikare:
    build:
      targets:
        Kikare: all
        KikareTests: [test]
    test:
      targets:
        - KikareTests
