name: Dialup
options:
  bundleIdPrefix: se.dialup
  deploymentTarget:
    macOS: "15.4"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.4"
targets:
  Dialup:
    type: application
    platform: macOS
    sources:
      - path: Host
      - path: Chrome
        type: folder
        buildPhase: resources
      - path: Start
        type: folder
        buildPhase: resources
      - path: Resources/SkinIcons
        type: folder
        buildPhase: resources
    info:
      path: Host/Info.plist
      properties:
        CFBundleDisplayName: Dialup
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "Dialup — a browser from 2003, built in 2026"
        LSApplicationCategoryType: public.app-category.productivity
        # A browser must load plain http:// sites (ATS would block them in the web view).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        # Lets macOS offer Dialup as the default web browser and send it links.
        CFBundleURLTypes:
          - CFBundleURLName: Web site URL
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes: [http, https]
        CFBundleDocumentTypes:
          - CFBundleTypeName: HTML document
            CFBundleTypeRole: Viewer
            LSItemContentTypes: [public.html]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.dialup.Dialup
        PRODUCT_NAME: Dialup
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
  DialupTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Dialup
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
schemes:
  Dialup:
    build:
      targets:
        Dialup: all
        DialupTests: [test]
    test:
      targets:
        - DialupTests
