name: Dialup
options:
  bundleIdPrefix: se.dialup
  deploymentTarget:
    macOS: "15.4"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.1
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.4"
targets:
  Dialup:
    type: application
    platform: macOS
    dependencies:
      - package: Sparkle
    sources:
      - path: Host
      - path: UI
        type: folder
        buildPhase: resources
      - path: Start
        type: folder
        buildPhase: resources
      - path: Resources/SkinIcons
        type: folder
        buildPhase: resources
    info:
      path: Host/Info.plist
      properties:
        CFBundleDisplayName: Dialup
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "© 2026 Viktor Fröberg"
        LSApplicationCategoryType: public.app-category.productivity
        # Updates (Sparkle): the newest GitHub release carries appcast.xml; archives are EdDSA-signed.
        SUFeedURL: $(DIALUP_FEED_URL)
        SUPublicEDKey: ljbksQb5dmHsUsCYxvT4JBHN5bUsNaBFC61xpbR/Fao=
        # Check daily in the background, without Sparkle's "check automatically?" prompt.
        SUEnableAutomaticChecks: true
        # A browser must load plain http:// sites (ATS would block them in the web view).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        # Lets macOS offer Dialup as the default web browser and send it links.
        CFBundleURLTypes:
          - CFBundleURLName: Web site URL
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes: [http, https]
        CFBundleDocumentTypes:
          - CFBundleTypeName: HTML document
            CFBundleTypeRole: Viewer
            LSItemContentTypes: [public.html]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.dialup.Dialup
        PRODUCT_NAME: Dialup
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        DIALUP_FEED_URL: https://github.com/viktorfroberg/Dialup/releases/latest/download/appcast.xml
  DialupTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Dialup
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
schemes:
  Dialup:
    build:
      targets:
        Dialup: all
        DialupTests: [test]
    test:
      targets:
        - DialupTests
